name: Meridian Compass CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-container-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ENV: test
      PORT: "8000"
      LLM_API_KEY: ""
      LLM_MODEL: ""
      LLM_BASE_URL: ""
      VECTOR_STORE_PATH: runtime_data/rag_index
      KNOWLEDGE_DATA_PATH: knowledge
      MOCK_DATA_PATH: mock_data
      MCP_TRANSPORT: streamable-http
      LOG_LEVEL: INFO
      HF_HOME: ${{ github.workspace }}/.cache/huggingface

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Build canonical test RAG index
        run: python scripts/build_index.py

      - name: Run automated tests
        run: python -m pytest

      - name: Verify canonical RAG readiness and retrieval
        run: python -c "from rag.service import KnowledgeService; from app.config import get_settings; s=get_settings(); rag=KnowledgeService(s.knowledge_data_path, s.vector_store_path); assert rag.load(), rag.error; results=rag.search('active assignment PTO approval', top_k=5); ids={item.document_id for item in results}; assert 'MSG-POL-001' in ids, ids; print('RAG acceptance passed:', sorted(ids))"

      - name: Verify MCP discovery and safe knowledge call
        run: python -m pytest tests/test_mcp_discovery.py

      - name: Build Docker image
        run: docker build --tag meridian-compass:ci .

      - name: Start Docker container
        run: docker run --detach --name meridian-compass-ci --publish 8000:8000 meridian-compass:ci

      - name: Verify container health
        run: |
          python - <<'PY'
          import json
          import time
          from urllib.error import URLError
          from urllib.request import urlopen

          expected = {
              "status": "healthy",
              "application": "meridian-compass",
              "mcp": "connected",
              "rag": "ready",
          }
          deadline = time.monotonic() + 120
          last_error = None
          while time.monotonic() < deadline:
              try:
                  with urlopen("http://127.0.0.1:8000/health", timeout=5) as response:
                      payload = json.load(response)
                  if payload == expected:
                      print("Container health acceptance passed:", payload)
                      break
                  last_error = AssertionError(
                      f"unexpected health payload: {payload!r}; expected: {expected!r}"
                  )
              except (OSError, URLError, ValueError) as exc:
                  last_error = exc
              time.sleep(2)
          else:
              raise SystemExit(f"container did not become healthy: {last_error}")
          PY

      - name: Show container logs on failure
        if: failure()
        run: docker logs meridian-compass-ci || true

      - name: Clean up Docker container
        if: always()
        run: docker rm --force meridian-compass-ci 2>/dev/null || true
